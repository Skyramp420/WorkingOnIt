<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'">
  <title>WorkingOnIt</title>
  <link rel="stylesheet" href="../../node_modules/@fontsource/fredoka/500.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/fredoka/600.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/fredoka/700.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/400.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/600.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/700.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/nunito/800.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource/jetbrains-mono/500.css">
  <link rel="stylesheet" href="../../node_modules/@fontsource-variable/bricolage-grotesque/standard.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="clean.css">
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-name">WorkingOnIt</span>
    <button class="spot-trigger" id="spotBtn" title="Spotlight"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span data-t>Hľadaj alebo napíš príkaz</span><kbd>Ctrl K</kbd></button>
    <div class="win-ctl">
      <button id="winMin" aria-label="Minimalizovať" data-t-attrs="aria-label"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
      <button id="winMax" aria-label="Maximalizovať" data-t-attrs="aria-label"><svg class="g-max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg><svg class="g-restore" viewBox="0 0 10 10"><rect x=".5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><path d="M2.5 2.5V.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>
      <button id="winClose" class="x" aria-label="Zavrieť" data-t-attrs="aria-label"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1.1"/></svg></button>
    </div>
  </div>

  <aside class="side">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#2c2c2e"/><rect x="5" y="8.5" width="13" height="4.2" rx="2.1" fill="#ff9f0a"/><rect x="11.5" y="14" width="15.5" height="4.2" rx="2.1" fill="#0a84ff"/><rect x="7" y="19.5" width="10.5" height="4.2" rx="2.1" fill="#bf5af2"/><rect x="19.6" y="6.5" width="1.4" height="19" rx=".7" fill="#ff453a"/><circle cx="20.3" cy="7" r="2.3" fill="#ff453a"/></svg>
      <span class="brand-name">WorkingOnIt</span>
    </div>

    <nav class="nav" id="nav">
      <button data-view="board" class="active"><svg viewBox="0 0 20 20"><rect x="2" y="3" width="4.5" height="14" rx="1.5"/><rect x="7.75" y="3" width="4.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="4.5" height="11" rx="1.5"/></svg><span data-t>Nástenka</span></button>
      <button data-view="timeline"><svg viewBox="0 0 20 20"><rect x="2" y="4" width="9" height="3.5" rx="1.5"/><rect x="6" y="9" width="12" height="3.5" rx="1.5"/><rect x="3" y="14" width="7" height="3.5" rx="1.5"/><path d="M12.5 2v16" stroke-width="1.6" stroke="currentColor" fill="none"/></svg><span data-t>Časová os</span></button>
      <button data-view="ideas"><svg viewBox="0 0 20 20"><path d="M7.2 13.6c-1.6-1.1-2.7-2.9-2.7-5A5.5 5.5 0 0 1 10 3a5.5 5.5 0 0 1 5.5 5.6c0 2.1-1.1 3.9-2.7 5v1.4H7.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.8 17h4.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-t>Nápady</span></button>
      <button data-view="time"><svg viewBox="0 0 20 20"><circle cx="10" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 7v4.2l2.6 1.6" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="8" y="1.5" width="4" height="2" rx="1"/></svg><span data-t>Čas</span><i class="nav-badge" id="timeBadge" hidden></i></button>
      <button data-view="clients"><svg viewBox="0 0 20 20"><circle cx="7.5" cy="7" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2 16.5c.8-2.8 3-4.3 5.5-4.3s4.7 1.5 5.5 4.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="14" cy="6" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M14.5 10.5c1.8.2 3.1 1.4 3.6 3.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><span data-t>Klienti</span></button>
      <button data-view="templates"><svg viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14.25 11v6.5M11 14.25h6.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span data-t>Šablóny</span></button>
      <button data-view="archive"><svg viewBox="0 0 20 20"><rect x="2.5" y="3" width="15" height="4.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 7.5v7.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V7.5M8 11h4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg><span data-t>Archív</span></button>
      <button data-view="money"><svg viewBox="0 0 20 20"><rect x="2" y="5" width="16" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="10" cy="10.5" r="2.4"/></svg><span data-t>Peniaze</span></button>
      <button data-view="settings"><svg viewBox="0 0 20 20"><path d="M3 6h8M15 6h2M3 14h2M9 14h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="6" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="14" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span data-t>Nastavenia</span></button>
    </nav>

    <div class="buddy" id="buddy">
      <div class="kit-timer">
        <button class="rec-dot" id="kitRecBtn" aria-label="Spustiť" title="Spustiť" data-t-attrs="aria-label,title"><i></i></button>
        <div class="kit-time" id="kitTime"><b id="ktBig" data-t>Dnes nič</b><span id="ktSmall"></span></div>
      </div>
      <div class="buddy-row">
        <div class="mascot" id="mascot" title="Klikni na mňa" data-t-attrs="title"></div>
        <div class="bubble" id="bubble"></div>
        <div class="lvl">
          <div class="lvl-top"><b id="lvlNum">Lvl 1</b><span id="lvlTitle" data-t>Nováčik</span></div>
          <div class="xpbar"><i id="xpFill"></i></div>
          <div class="lvl-sub"><span id="xpText">0 / 100 XP</span><span id="streak" class="streak"></span></div>
        </div>
      </div>
      <div class="buddy-actions" id="bubbleActions" hidden></div>
      <div class="kit-acts">
        <button class="btn small ask-kit" id="askKit"><svg viewBox="0 0 20 20"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h7A2.5 2.5 0 0 1 16 5.5v5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5V13A2.5 2.5 0 0 1 4 10.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span id="askKitLabel" data-t>Opýtať sa Kita</span></button>
      </div>
    </div>
    <button class="side-foot" id="sideFoot" title="Profil, odznaky a recapy" data-t-attrs="title"></button>
  </aside>

  <main class="main">
    <header class="top">
      <div class="top-title">
        <h1 id="viewTitle" data-t>Nástenka</h1>
        <p id="viewSub"></p>
      </div>
      <div class="rec" id="rec">
        <span class="rec-dot"></span>
        <div class="rec-tc" id="recTc">00:00:00:00</div>
        <div class="rec-meta">
          <b id="recWhat" data-t>Nič sa nenahráva</b>
          <span id="recApp" data-t>Otvor strihací program alebo spusti časovač</span>
        </div>
        <button class="rec-btn" id="recBtn" data-t>Spustiť</button>
      </div>
      <button class="btn primary" id="addBtn"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span data-t>Nová zákazka</span></button>
    </header>

    <section class="view" id="view-board"></section>
    <section class="view" id="view-timeline" hidden></section>
    <section class="view" id="view-ideas" hidden></section>
    <section class="view" id="view-time" hidden></section>
    <section class="view" id="view-clients" hidden></section>
    <section class="view" id="view-templates" hidden></section>
    <section class="view" id="view-archive" hidden></section>
    <section class="view" id="view-profile" hidden></section>
    <section class="view" id="view-money" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <aside class="drawer idea-page" id="ideaPage" aria-hidden="true"></aside>
  <div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal"></div></div>
  <aside class="chat" id="chat" hidden></aside>
  <div class="spot-wrap" id="spotWrap" hidden></div>
  <div class="toasts" id="toasts"></div>
  <canvas id="fx"></canvas>

  <script src="../shared/i18n.js"></script>
  <script src="../shared/lang-en.js"></script>
  <script src="../shared/logic.js"></script>
  <script src="../shared/parse.js"></script>
  <script src="mock.js"></script>
  <script src="look.js"></script>
  <script src="mascot.js"></script>
  <script src="kit.js"></script>
  <script src="rte.js"></script>
  <script src="icons.js"></script>
  <script src="sketch.js"></script>
  <script src="ideas.js"></script>
  <script src="timeline.js"></script>
  <script src="onboarding.js"></script>
  <script src="templates.js"></script>
  <script src="spotlight.js"></script>
  <script src="fx.js"></script>
  <script src="polish.js"></script>
  <script src="app.js"></script>
</body>
</html>
